name: Build & Release PulseWave Music APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build Signed Android Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/pulsewave-release.jks" \
            -alias pulsewave \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass pulsewave123 \
            -keypass pulsewave123 \
            -dname "CN=PulseWave Music, OU=Audio, O=PulseWave, L=Kolkata, S=WB, C=IN"

      - name: Build Signed Release APKs
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/pulsewave-release.jks
          KEYSTORE_PASSWORD: pulsewave123
          KEY_ALIAS: pulsewave
          KEY_PASSWORD: pulsewave123
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Inspect Built APKs & Sizes
        run: |
          echo "### PulseWave Music Built APKs" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          for apk in app/build/outputs/apk/release/*.apk; do
            size_h=$(du -h "$apk" | cut -f1)
            name=$(basename "$apk")
            echo "Built: $name ($size_h)"
            echo "| \`$name\` | **$size_h** |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload Signed APKs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseWave-Music-Signed-APKs
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APKs to GitHub Releases (v1.0.0)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0"
          NOTES="## PulseWave Music v1.0.0 — Native Android YouTube Music Player

          - **100% Native Kotlin + Jetpack Compose + Media3 ExoPlayer** (Zero WebView, Zero Login, Zero Cloud Database)
          - **Ad-Free YouTube & YT Music Audio Streaming** via Dual-Engine Extractor (**NewPipe VisionOS Progressive DASH** + **Embedded Python yt-dlp + FFmpeg**)
          - **Background & Lockscreen Playback** with Bluetooth Earphone controls
          - **Offline Song Downloader** (Save songs locally in M4A/WebM for zero-internet playback)
          - **Pro Audio Studio**: Hardware 5-Band Equalizer, Sub-Bass Boost, 3D Virtualizer, Loudness Enhancer & **Slowed + Reverb / Nightcore Speed & Pitch**
          - **Time-Synced Lyrics** powered by LRCLIB
          - **Offline Ambient Soundscape Mixer**: Layer Midnight Rain, Warm Vinyl Crackle, Ocean Surf, Distant Thunder & Dream Pad underneath any YouTube song!

          ### Which APK should I install?
          - **Recommended for almost all phones (64-bit Android):** \`PulseWave-v1.0.0-arm64-v8a-release.apk\`
          - **Older 32-bit Android phones:** \`PulseWave-v1.0.0-armeabi-v7a-release.apk\`
          - **Universal (All CPU architectures):** \`PulseWave-v1.0.0-universal-release.apk\`"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" app/build/outputs/apk/release/*.apk --clobber
            gh release edit "$TAG" --title "PulseWave Music v1.0.0 (Signed Android APKs)" --notes "$NOTES"
          else
            gh release create "$TAG" app/build/outputs/apk/release/*.apk \
              --target "${{ github.sha }}" \
              --title "PulseWave Music v1.0.0 (Signed Android APKs)" \
              --notes "$NOTES"
          fi
